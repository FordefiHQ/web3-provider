name: Publish Release

on:
  # Publishing must run with `main` as the ref: the `production` environment
  # restricts deployments to `main`. A `pull_request` run's ref is
  # `refs/pull/N/merge`, which is why merging a release PR never published.
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (optional - will use package.json if not provided)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write # for npm provenance

concurrency: 
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

env:
  # Trusted publishing (OIDC) requires Node >= 22.14.0 and npm >= 11.5.1
  NODE_VERSION: "24"
  SLACK_CHANNEL_ID: "C072BEST4AC"
  PACKAGE_NAME: "@fordefi/web3-provider"
  WORKFLOW_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.version.outputs.version }}
      version-tag: ${{ steps.version.outputs.version-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Get Version
        id: version
        env:
          # Passed via env, not interpolated into the script, to avoid shell injection
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -e

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(yarn --silent version:current)"
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "❌ Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version-tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Validate Release
        id: check
        run: |
          # Already published. This is the expected outcome for any push to `main`
          # that touched package.json without bumping the version, so skip cleanly
          # instead of failing the run.
          if npm view ${{ env.PACKAGE_NAME }}@$VERSION > /dev/null 2>&1; then
            echo "⏭️ Version $VERSION is already published, nothing to release"
            echo "should-release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Unpublished version but the tag already exists: inconsistent state worth
          # surfacing rather than skipping.
          if git tag -l "v$VERSION" | grep -q "v$VERSION"; then
            echo "❌ Git tag v$VERSION exists but $VERSION is not published"
            echo "should-release=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Version $VERSION is ready for release"
          echo "should-release=true" >> $GITHUB_OUTPUT

      - name: Type checks
        if: steps.check.outputs.should-release == 'true'
        run: yarn ts:check

      - name: Build Package
        if: steps.check.outputs.should-release == 'true'
        run: yarn build

  publish-to-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: validate-release
    if: needs.validate-release.outputs.should-release == 'true'
    environment: production
    outputs:
      version: ${{ needs.validate-release.outputs.version }}
      version-tag: ${{ needs.validate-release.outputs.version-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Package
        run: yarn build

      - name: Verify Trusted Publishing Prerequisites
        run: |
          set -e

          node --version

          # Trusted publishing (OIDC) requires npm >= 11.5.1
          NPM_VERSION="$(npm --version)"
          MIN_NPM_VERSION="11.5.1"

          if [ "$(printf '%s\n%s\n' "$MIN_NPM_VERSION" "$NPM_VERSION" | sort -V | head -1)" != "$MIN_NPM_VERSION" ]; then
            echo "❌ npm $NPM_VERSION is too old for trusted publishing (need >= $MIN_NPM_VERSION)"
            exit 1
          fi

          echo "✅ npm $NPM_VERSION supports trusted publishing"

      # No NODE_AUTH_TOKEN: authentication comes from the OIDC token exchanged
      # against the npm trusted publisher configured for this repo + workflow.
      # Provenance attestations are generated automatically.
      - name: Publish to NPM
        run: npm publish --tag latest

      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NPM_RELEASE_URL: "https://www.npmjs.com/package/${{ env.PACKAGE_NAME }}/v/${{ needs.validate-release.outputs.version }}"
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Release `${{ needs.validate-release.outputs.version-tag }}` was successfully published to NPM* 📦\n<${{ env.NPM_RELEASE_URL }}|View on NPM> | <${{ env.WORKFLOW_URL }}|Workflow>"
                  }
                }
              ]
            }

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Release `${{ needs.validate-release.outputs.version-tag }}` failed to publish to NPM* ❌\n<${{ env.WORKFLOW_URL }}|View Workflow>"
                  }
                }
              ]
            }

  create-release:
    name: Create GitHub Release
    needs: [validate-release, publish-to-npm]
    runs-on: ubuntu-latest
    if: needs.validate-release.outputs.should-release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Github API Token
        id: generate-gh-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CREATE_PR_APP_ID }}
          private-key: ${{ secrets.CREATE_PR_APP_PRIVATE_KEY }}

      - name: Make Sure The Token Is Valid
        env:
          GH_TOKEN: ${{ steps.generate-gh-token.outputs.token }}
        run: |
          set -e
          gh auth status

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.generate-gh-token.outputs.token }}
        run: |
          # --target creates the tag at this commit. Using --verify-tag instead would
          # deadlock: the Validate Release job fails if the tag already exists.
          gh release create ${{ needs.validate-release.outputs.version-tag }} \
            --title "Release ${{ needs.validate-release.outputs.version-tag }}" \
            --generate-notes \
            --target ${{ github.sha }}

      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RELEASE_URL: "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.validate-release.outputs.version-tag }}"
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*GitHub Release `${{ needs.validate-release.outputs.version-tag }}` created successfully* 🚀\n<${{ env.GITHUB_RELEASE_URL }}|View Release>"
                  }
                }
              ]
            }

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ env.SLACK_CHANNEL_ID }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*GitHub Release creation failed for `${{ needs.validate-release.outputs.version-tag }}`* ❌\n<${{ env.WORKFLOW_URL }}|View Workflow>"
                  }
                }
              ]
            } 