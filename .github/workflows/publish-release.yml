name: Publish Release

on:
  # Must be `push`: the production environment rejects a pull_request ref (refs/pull/N/merge)
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (optional - must match package.json; guards against dispatching the wrong ref)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write # for npm trusted publishing (OIDC)

concurrency: 
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

env:
  SLACK_CHANNEL_ID: "C072BEST4AC"
  PACKAGE_NAME: "@fordefi/web3-provider"
  WORKFLOW_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.version.outputs.version }}
      version-tag: ${{ steps.version.outputs.version-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # .nvmrc must stay >= 22.14.0; the prerequisite step below enforces npm >= 11.5.1
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Get Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }} # via env, not interpolated, to avoid shell injection
        run: |
          set -e

          VERSION="$(yarn --silent version:current)"

          # npm publish always publishes package.json's version, so the input can only assert it
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$VERSION" ]; then
            echo "❌ Requested version $INPUT_VERSION does not match package.json ($VERSION)"
            echo "   Bump package.json on main first, or dispatch without a version."
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "❌ Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version-tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Validate Release
        id: check
        run: |
          # A query failure must not read as "not published"; stderr stays out of the JSON
          set +e
          PUBLISHED_VERSIONS="$(npm view "$PACKAGE_NAME" versions --json 2> "$RUNNER_TEMP/npm-view.err")"
          NPM_VIEW_EXIT=$?
          set -e

          if [ $NPM_VIEW_EXIT -ne 0 ]; then
            if grep -q 'E404' "$RUNNER_TEMP/npm-view.err"; then
              PUBLISHED_VERSIONS="[]" # package has never been published at all
            else
              echo "❌ Could not query npm for $PACKAGE_NAME:"
              cat "$RUNNER_TEMP/npm-view.err"
              exit 1
            fi
          fi

          # `versions` is an array, except for a package with exactly one version
          IS_PUBLISHED="$(echo "$PUBLISHED_VERSIONS" | jq -r --arg v "$VERSION" \
            'if type == "array" then (index($v) != null) else (. == $v) end')"

          # Expected for any package.json change that doesn't bump the version, so skip cleanly
          if [ "$IS_PUBLISHED" = "true" ]; then
            echo "⏭️ Version $VERSION is already published, nothing to release"
            echo "⏭️ \`$PACKAGE_NAME@$VERSION\` is already published — nothing to release." >> $GITHUB_STEP_SUMMARY
            echo "should-release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Unpublished version but the tag exists: inconsistent state, surface it
          if git tag -l "v$VERSION" | grep -q "v$VERSION"; then
            echo "❌ Git tag v$VERSION exists but $VERSION is not published"
            echo "should-release=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Version $VERSION is ready for release"
          echo "should-release=true" >> $GITHUB_OUTPUT

      - name: Type checks
        if: steps.check.outputs.should-release == 'true'
        run: yarn ts:check

      - name: Build Package
        if: steps.check.outputs.should-release == 'true'
        run: yarn build

  publish-to-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: validate-release
    if: needs.validate-release.outputs.should-release == 'true'
    environment: production
    outputs:
      version: ${{ needs.validate-release.outputs.version }}
      version-tag: ${{ needs.validate-release.outputs.version-tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          # No `registry-url`: it writes `_authToken=${NODE_AUTH_TOKEN}` into an .npmrc, and with
          # no token that placeholder shadows the OIDC exchange. npm defaults to npmjs.org anyway.
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Package
        run: yarn build

      - name: Verify Trusted Publishing Prerequisites
        run: |
          set -e

          node --version

          NPM_VERSION="$(npm --version)"
          MIN_NPM_VERSION="11.5.1"

          if [ "$(printf '%s\n%s\n' "$MIN_NPM_VERSION" "$NPM_VERSION" | sort -V | head -1)" != "$MIN_NPM_VERSION" ]; then
            echo "❌ npm $NPM_VERSION is too old for trusted publishing (need >= $MIN_NPM_VERSION)"
            exit 1
          fi

          echo "✅ npm $NPM_VERSION supports trusted publishing"

          # A credential would shadow OIDC. `list` prints the key; `config get` throws on it.
          if npm config list | grep -q '_authToken'; then
            echo "❌ A registry auth token is configured; it would shadow trusted publishing"
            npm config list | grep '_authToken'
            exit 1
          fi

          echo "✅ No registry credential configured, OIDC will be used"

      - name: Publish to NPM
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -e

          # A prerelease must not take over the `latest` dist-tag
          case "$VERSION" in
            *-*) NPM_TAG="beta" ;;
            *)   NPM_TAG="latest" ;;
          esac

          echo "Publishing $VERSION with dist-tag $NPM_TAG"
          npm publish --tag "$NPM_TAG"

      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v4.0.0
        env:
          NPM_RELEASE_URL: "https://www.npmjs.com/package/${{ env.PACKAGE_NAME }}/v/${{ needs.validate-release.outputs.version }}"
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL_ID }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Release `${{ needs.validate-release.outputs.version-tag }}` was successfully published to NPM* 📦\n<${{ env.NPM_RELEASE_URL }}|View on NPM> | <${{ env.WORKFLOW_URL }}|Workflow>"
                  }
                }
              ]
            }

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL_ID }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Release `${{ needs.validate-release.outputs.version-tag }}` failed to publish to NPM* ❌\n<${{ env.WORKFLOW_URL }}|View Workflow>"
                  }
                }
              ]
            }

  create-release:
    name: Create GitHub Release
    needs: [validate-release, publish-to-npm]
    runs-on: ubuntu-latest
    if: needs.validate-release.outputs.should-release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --target creates the tag; --verify-tag would deadlock with the validate step
          gh release create ${{ needs.validate-release.outputs.version-tag }} \
            --title "Release ${{ needs.validate-release.outputs.version-tag }}" \
            --generate-notes \
            --target ${{ github.sha }}

      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v4.0.0
        env:
          GITHUB_RELEASE_URL: "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.validate-release.outputs.version-tag }}"
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL_ID }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*GitHub Release `${{ needs.validate-release.outputs.version-tag }}` created successfully* 🚀\n<${{ env.GITHUB_RELEASE_URL }}|View Release>"
                  }
                }
              ]
            }

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL_ID }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*GitHub Release creation failed for `${{ needs.validate-release.outputs.version-tag }}`* ❌\n<${{ env.WORKFLOW_URL }}|View Workflow>"
                  }
                }
              ]
            } 